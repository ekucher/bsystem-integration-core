openapi: 3.1.0
info:
  title: BSYSTEM Integration Core API
  version: 0.8.0
  summary: Authorization-aware normalized API for the BSYSTEM Platform.
  description: |
    The Integration Core exposes a normalized view of the systems BSYSTEM
    integrates with. Source systems stay authoritative; this API never
    re-exposes a raw upstream payload.

    Three surfaces are served:

    - `/api/v1/*` — the human API, authenticated with a user access token.
    - `/api/service/v1/*` — the machine API, authenticated with a service
      identity in the `BSYSTEM-Services` group.
    - `/health`, `/readyz`, `/metrics` — operational endpoints, unauthenticated
      by design, which disclose no business data.

    Authorization is enforced in the backend for every request and denies by
    default. An unknown or unmapped resource results in denial, never in
    broader access.

    Every response carries `X-Request-ID`, echoing the caller's value or a
    generated one, and the same identifier reaches the audit trail and
    published events.

    This document is contract-tested against the server's own route inventory:
    an endpoint cannot be added or removed without the documentation changing
    with it.
  contact:
    name: BSYSTEM Platform
    url: https://github.com/ekucher/bsystem-integration-core
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: The Integration Core, behind the platform reverse proxy.
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: The authenticated principal and the access it resolves to.
  - name: Business
    description: Normalized entities sourced from the authoritative systems.
  - name: Global IDs
    description: Immutable platform identifiers for upstream records.
  - name: Administration
    description: Audit trail and RBAC administration. Administrator only.
  - name: Service
    description: The machine API, for service identities only.
  - name: Operations
    description: Unauthenticated health, readiness and metrics.

paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Report service and dependency health
      security: []
      responses:
        '200':
          description: The service is up. Dependencies may be degraded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example:
                status: ok
                service: bsystem-integration-core
                version: 0.5.0
                timestamp: '2026-01-06T11:30:00Z'
                checks: {database: ok, nats: ok}
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Report whether the service can serve traffic
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example:
                status: ready
                checks: {database: ok, nats: ok}
        '503':
          description: Not ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}

  /metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Expose Prometheus-compatible metrics
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: {type: string}
              example: |
                # HELP bsystem_integration_database_up PostgreSQL availability (1=up, 0=down).
                # TYPE bsystem_integration_database_up gauge
                bsystem_integration_database_up 1

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Return the authenticated user and their effective access
      description: |
        Allocates the caller's `USR-*` Global ID on first sight and returns it
        unchanged afterwards. A principal whose groups map to no role resolves
        to empty roles, permissions and modules rather than to an error.
      responses:
        '200':
          description: The user profile and resolved authorization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
              example:
                id: USR-000001
                subject: ak-user-9f2c
                email: developer@bsystem.example
                name: Example Developer
                username: developer
                groups: [BSYSTEM-Developers]
                roles: [Developer]
                permissions: [projects.task.read, wiki.document.read]
                modules: [projects, wiki]
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/modules:
    get:
      tags: [Identity]
      operationId: listModules
      summary: List the modules the authenticated user may see
      responses:
        '200':
          description: The modules the caller's roles grant, filtered server-side.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Module'}
              example:
                - {id: projects, name: Projects, description: Project and task management, status: available}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/clients:
    get:
      tags: [Business]
      operationId: listClients
      summary: List normalized clients
      description: Requires `crm.client.read`. EspoCRM remains authoritative.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Clients with `CL-*` Global IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Client'}
              example:
                data:
                  - {id: CL-000001, source: espocrm, source_id: acc-northwind, name: Northwind Trading, website: 'https://northwind.example', email: info@northwind.example}
                pagination: {total: 3, limit: 1, next_cursor: bzox}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/contacts:
    get:
      tags: [Business]
      operationId: listContacts
      summary: List normalized contacts
      description: |
        Requires `crm.client.read`. A contact whose upstream account is unknown
        is returned without a `client_id`: a missing mapping never broadens
        what the caller can reach.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Contacts with `CT-*` Global IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Contact'}
              example:
                data:
                  - {id: CT-000001, source: espocrm, source_id: ct-anna, name: Anna Kovalenko, client_id: CL-000001, email: anna@northwind.example}
                pagination: {total: 3, limit: 1, next_cursor: bzox}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/projects:
    get:
      tags: [Business]
      operationId: listProjects
      summary: List normalized projects
      description: Requires `projects.task.read`. Redmine remains authoritative.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects with `PR-*` Global IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Project'}
              example:
                data:
                  - {id: PR-000001, source: redmine, source_id: '101', name: Northwind Portal, identifier: northwind-portal}
                pagination: {total: 3, limit: 1, next_cursor: bzox}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/issues:
    get:
      tags: [Business]
      operationId: listIssues
      summary: List normalized issues
      description: Requires `projects.task.read`. Redmine remains authoritative.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: project
          in: query
          required: false
          description: Restrict to one project, by upstream numeric id or identifier.
          schema: {type: string}
          example: northwind-portal
      responses:
        '200':
          description: Issues with `TSK-*` Global IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Issue'}
              example:
                data:
                  - {id: TSK-000001, source: redmine, source_id: '5001', subject: Design portal navigation, project_id: PR-000001, status: New}
                pagination: {total: 3, limit: 1, next_cursor: bzox}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/documents:
    get:
      tags: [Business]
      operationId: listDocuments
      summary: List normalized internal documents
      description: |
        Requires `wiki.document.read`. The Customer role is scope-confined, so
        it is denied with `scope_required` until tenant ownership is
        authoritative: an undecided ownership boundary must deny rather than
        disclose.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Documents with `DOC-*` Global IDs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Document'}
              example:
                data:
                  - {id: DOC-000001, source: outline, source_id: doc-runbook, title: Integration Core Runbook, collection_id: col-internal, updated_at: '2026-01-06T11:30:00.000Z'}
                pagination: {total: 3, limit: 1, next_cursor: bzox}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Missing `wiki.document.read`, or a tenant scope is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: wiki.document.read requires a scope grant for this resource, code: scope_required}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/clients/{id}:
    get:
      tags: [Business]
      operationId: getClient
      summary: Read one normalized client
      description: |
        Requires `crm.client.read`, evaluated against this specific resource.

        An unknown Global ID, a Global ID belonging to a different entity type,
        and a resource a scope-confined caller has not been granted are all
        answered with the same `404`, so the endpoint cannot be used to
        discover which identifiers exist or who owns them.
      parameters:
        - $ref: '#/components/parameters/GlobalID'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/contacts/{id}:
    get:
      tags: [Business]
      operationId: getContact
      summary: Read one normalized contact
      description: |
        Requires `crm.client.read`, evaluated against this specific resource.

        An unknown Global ID, a Global ID belonging to a different entity type,
        and a resource a scope-confined caller has not been granted are all
        answered with the same `404`, so the endpoint cannot be used to
        discover which identifiers exist or who owns them.

        `client_id` is reported only when the owning client is already
        mapped; reading a contact never allocates a Global ID.
      parameters:
        - $ref: '#/components/parameters/GlobalID'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/projects/{id}:
    get:
      tags: [Business]
      operationId: getProject
      summary: Read one normalized project
      description: |
        Requires `projects.task.read`, evaluated against this specific resource.

        An unknown Global ID, a Global ID belonging to a different entity type,
        and a resource a scope-confined caller has not been granted are all
        answered with the same `404`, so the endpoint cannot be used to
        discover which identifiers exist or who owns them.
      parameters:
        - $ref: '#/components/parameters/GlobalID'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/issues/{id}:
    get:
      tags: [Business]
      operationId: getIssue
      summary: Read one normalized issue
      description: |
        Requires `projects.task.read`, evaluated against this specific resource.

        An unknown Global ID, a Global ID belonging to a different entity type,
        and a resource a scope-confined caller has not been granted are all
        answered with the same `404`, so the endpoint cannot be used to
        discover which identifiers exist or who owns them.
      parameters:
        - $ref: '#/components/parameters/GlobalID'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Issue'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/documents/{id}:
    get:
      tags: [Business]
      operationId: getDocument
      summary: Read one normalized document
      description: |
        Requires `wiki.document.read`, evaluated against this specific resource.

        An unknown Global ID, a Global ID belonging to a different entity type,
        and a resource a scope-confined caller has not been granted are all
        answered with the same `404`, so the endpoint cannot be used to
        discover which identifiers exist or who owns them.
      parameters:
        - $ref: '#/components/parameters/GlobalID'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/global-ids:
    post:
      tags: [Global IDs]
      operationId: createGlobalID
      summary: Allocate or resolve a Global ID mapping
      description: |
        Administrator only. The operation is idempotent: mapping the same
        `(source, entity_type, source_id)` again returns the identifier
        already allocated. Global IDs are immutable once issued.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalIDRequest'}
            example: {entity_type: client, source: espocrm, source_id: acc-northwind, metadata: {name: Northwind Trading}}
      responses:
        '201':
          description: The mapping, newly allocated or already existing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalEntity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/global-ids/{id}:
    get:
      tags: [Global IDs]
      operationId: resolveGlobalID
      summary: Resolve a Global ID to its upstream mapping
      description: Administrator only. Reads are audited.
      parameters:
        - name: id
          in: path
          required: true
          description: The Global ID to resolve.
          schema: {type: string, pattern: '^[A-Z]+-[0-9]+$'}
          example: CL-000001
      responses:
        '200':
          description: The mapping.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalEntity'}
              example: {global_id: CL-000001, entity_type: client, source: espocrm, source_id: acc-northwind, created_at: '2026-01-06T11:30:00Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/audit:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      summary: List audit events
      description: Administrator only. The audit trail records who read and changed what.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum events to return, newest first.
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEvent'}
              example:
                - {id: 42, occurred_at: '2026-01-06T11:30:00Z', subject: ak-user-9f2c, global_user_id: USR-000001, action: global_id.created, resource_type: client, resource_id: CL-000001, request_id: 4f1c2a, source_ip: 10.0.0.7}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/admin/rbac/roles:
    get:
      tags: [Administration]
      operationId: listRoles
      summary: List persistent RBAC roles
      description: Administrator only.
      responses:
        '200':
          description: Roles with their permissions and modules.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Role'}
              example:
                - {id: developer, name: Developer, kind: human, description: Development and project work, enabled: true, permissions: [projects.task.read], modules: [projects]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/admin/rbac/scopes:
    get:
      tags: [Administration]
      operationId: listScopeGrants
      summary: List the scope grants held by a principal
      description: Administrator only.
      parameters:
        - name: principal_type
          in: query
          required: true
          schema: {type: string, enum: [user, service, group]}
          example: user
        - name: principal_id
          in: query
          required: true
          description: The principal's Global ID, or the group name for a group principal.
          schema: {type: string}
          example: USR-000001
      responses:
        '200':
          description: Scope grants.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ScopeGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Administration]
      operationId: grantScope
      summary: Grant a scoped permission to a principal
      description: Administrator only. The grant is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeGrant'}
            example: {principal_type: user, principal_id: USR-000001, scope_type: project, scope_id: PR-000001, permission_id: projects.task.read}
      responses:
        '201':
          description: The grant created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopeGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Administration]
      operationId: revokeScope
      summary: Revoke a scoped permission from a principal
      description: Administrator only. The revocation is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeGrant'}
      responses:
        '200':
          description: The grant revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopeGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/service/v1/whoami:
    get:
      tags: [Service]
      operationId: serviceWhoAmI
      summary: Return the authenticated service identity
      description: |
        Allocates the caller's `SVC-*` Global ID on first sight and returns it
        unchanged afterwards. A human token is refused here, and a token
        outside `BSYSTEM-Services` is refused too.
      security:
        - serviceAuth: []
      responses:
        '200':
          description: The service principal and its resolved authorization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicePrincipal'}
              example:
                id: SVC-000001
                subject: ak-service-3b7d
                name: BSYSTEM Core Service
                username: svc-core
                groups: [BSYSTEM-Services]
                roles: [Service Core]
                permissions: [adapters.read, events.publish, global_ids.read]
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/service/v1/adapters:
    get:
      tags: [Service]
      operationId: listAdapters
      summary: List the registered upstream adapters
      description: Requires `adapters.read`.
      security:
        - serviceAuth: []
      responses:
        '200':
          description: Adapter registry contents.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdapterInfo'}
              example:
                - {id: espocrm, name: EspoCRM, version: '1', status: ready, capabilities: [clients.read, contacts.read]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}

  /api/service/v1/adapters/health:
    get:
      tags: [Service]
      operationId: getAdapterHealth
      summary: Probe every registered adapter
      description: Requires `adapters.read`. Messages are credential-safe.
      security:
        - serviceAuth: []
      responses:
        '200':
          description: Per-adapter health, keyed by adapter id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: '#/components/schemas/AdapterHealth'}
              example:
                espocrm: {status: ready}
                redmine: {status: ready}
                outline: {status: degraded, message: HTTP 429}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}

  /api/service/v1/events:
    post:
      tags: [Service]
      operationId: publishEvent
      summary: Publish a normalized platform event
      description: |
        Requires `events.publish`. The envelope is normalized before
        publication and delivered on `bsystem.events.<event>`. `actor_id` and
        `request_id` are filled from the calling identity and the request
        correlation id when the caller omits them.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventEnvelope'}
            example: {event: backup.failed, source: bsystem-operations, entity_id: SRV-000004, severity: error, data: {job: nightly}}
      responses:
        '202':
          description: The normalized envelope, as published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}
        '503':
          description: The event bus is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access token
      description: A human access token issued by authentik.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access token
      description: |
        A service identity access token issued by authentik. The identity must
        be a member of `BSYSTEM-Services`.

  parameters:
    GlobalID:
      name: id
      in: path
      required: true
      description: The resource's immutable platform Global ID.
      schema: {type: string, pattern: '^[A-Z]+-[0-9]+$'}
      example: CL-000001
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum items to return. A value above the maximum is clamped rather
        than rejected, so a caller asking for more than the platform serves
        gets the maximum. The cap is what stops one request pulling an
        unbounded amount of upstream data.

        The effective maximum depends on the source system: 200 for CRM
        collections, 100 for project and document collections.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        An opaque position taken from a previous response's
        `pagination.next_cursor`. Omit it for the first page.

        Cursors must not be constructed or parsed by callers: the encoding is
        an implementation detail and will change when a source system gains
        real cursors. A cursor the platform did not issue is rejected with
        `invalid_cursor` rather than reinterpreted.
      schema: {type: string}

  responses:
    BadRequest:
      description: |
        The request is malformed, missing a required field, or carries a
        pagination cursor the platform did not issue.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid pagination cursor, code: invalid_cursor}
    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid or expired token}
    Forbidden:
      description: |
        The caller is authenticated but is not authorized.

        `permission_required` means the caller does not hold the permission.
        `scope_required` means the caller holds it but may only exercise it
        inside a scope they have been granted, and no grant matches.

        The body names the missing permission and nothing else: it never
        discloses whether the resource exists or who owns it.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: crm.client.read permission required, code: permission_required}
    ServiceForbidden:
      description: |
        The token is not a service identity in `BSYSTEM-Services`, or the
        identity lacks the required permission.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: service identity group required}
    NotFound:
      description: |
        The resource does not exist, or the caller may not learn that it does.
        The two are deliberately indistinguishable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: resource not found, code: not_found}
    UpstreamUnavailable:
      description: |
        The upstream system failed, rate-limited the platform or timed out.
        Upstream status codes, hostnames, credentials and payloads are never
        forwarded; the failing system is named only by its adapter id.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: upstream service unavailable, code: upstream_unavailable, source: espocrm}
    DependencyUnavailable:
      description: A platform dependency, such as the database, is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: RBAC store unavailable}

  schemas:
    Collection:
      type: object
      description: |
        The envelope every normalized collection returns. `data` holds the
        current page; `pagination` says how to continue.
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination: {$ref: '#/components/schemas/Pagination'}

    Pagination:
      type: object
      description: |
        Describes the returned window. A caller walks a collection by
        following `next_cursor` until it is absent; it is never present on the
        final page, so the walk always terminates.
      required: [total, limit]
      properties:
        total:
          type: integer
          description: |
            The size of the whole collection as the source system reports it,
            not the size of this page.
        limit:
          type: integer
          description: The number of items actually returned in this page.
        next_cursor:
          type: string
          description: |
            Opaque position of the following page. Absent once the collection
            is exhausted.
      examples:
        - {total: 42, limit: 50, next_cursor: bzo1MA}

    Error:
      type: object
      description: |
        The single error shape for every failure. `error` is always present
        and human-readable; `code` is the stable machine-readable form where
        one is defined. No field ever carries a credential, an internal
        hostname, a stack trace or an upstream payload.
      required: [error]
      properties:
        error: {type: string, description: Human-readable summary.}
        code:
          type: string
          description: Stable machine-readable code.
          enum: [upstream_unavailable, scope_required, permission_required, not_found, invalid_cursor]
        source:
          type: string
          description: The adapter id of the failing upstream, when applicable.
        request_id:
          type: string
          description: Correlation id, matching the `X-Request-ID` response header.
      examples:
        - {error: upstream service unavailable, code: upstream_unavailable, source: redmine}

    Health:
      type: object
      required: [status, service, version, timestamp, checks]
      properties:
        status: {type: string, enum: [ok, degraded]}
        service: {type: string}
        version: {type: string}
        timestamp: {type: string, format: date-time}
        checks:
          type: object
          description: Per-dependency state, keyed by dependency name.
          additionalProperties: {type: string, enum: [ok, degraded, error]}

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          additionalProperties: {type: string, enum: [ok, degraded, error]}

    Me:
      type: object
      description: The authenticated user and the access their groups resolve to.
      required: [id, subject, groups, roles, permissions, modules]
      properties:
        id: {type: string, description: Immutable `USR-*` Global ID., pattern: '^USR-[0-9]+$'}
        subject: {type: string, description: The authentik subject claim.}
        email: {type: string}
        name: {type: string}
        username: {type: string}
        groups: {type: array, items: {type: string}}
        roles: {type: array, items: {type: string}}
        permissions:
          type: array
          description: Effective permissions. `*` denotes full administration.
          items: {type: string}
        modules: {type: array, items: {type: string}}

    Module:
      type: object
      required: [id, name, description, status]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string}

    Client:
      type: object
      description: A client, normalized from the authoritative CRM.
      required: [id, source, source_id, name]
      properties:
        id: {type: string, pattern: '^CL-[0-9]+$'}
        source: {type: string, example: espocrm}
        source_id: {type: string, description: The identifier in the source system.}
        name: {type: string}
        website: {type: string}
        email: {type: string}
        phone: {type: string}

    Contact:
      type: object
      description: A contact, normalized from the authoritative CRM.
      required: [id, source, source_id, name]
      properties:
        id: {type: string, pattern: '^CT-[0-9]+$'}
        source: {type: string, example: espocrm}
        source_id: {type: string}
        name: {type: string}
        client_id:
          type: string
          description: |
            The owning client's Global ID. Absent when the upstream record has
            no account, or when that account has no mapping yet.
          pattern: '^CL-[0-9]+$'
        email: {type: string}
        phone: {type: string}

    Project:
      type: object
      description: A project, normalized from the authoritative project system.
      required: [id, source, source_id, name, identifier]
      properties:
        id: {type: string, pattern: '^PR-[0-9]+$'}
        source: {type: string, example: redmine}
        source_id: {type: string}
        name: {type: string}
        identifier: {type: string, description: The upstream slug.}
        description: {type: string}

    Issue:
      type: object
      description: An issue or task, normalized from the authoritative project system.
      required: [id, source, source_id, subject]
      properties:
        id: {type: string, pattern: '^TSK-[0-9]+$'}
        source: {type: string, example: redmine}
        source_id: {type: string}
        subject: {type: string}
        project_id:
          type: string
          description: The owning project's Global ID, when it is mapped.
          pattern: '^PR-[0-9]+$'
        status: {type: string, description: The upstream status name.}

    Document:
      type: object
      description: A document, normalized from the authoritative wiki.
      required: [id, source, source_id, title]
      properties:
        id: {type: string, pattern: '^DOC-[0-9]+$'}
        source: {type: string, example: outline}
        source_id: {type: string}
        title: {type: string}
        url: {type: string, description: The path within the source system.}
        collection_id: {type: string}
        updated_at: {type: string}

    GlobalIDRequest:
      type: object
      required: [entity_type, source, source_id]
      properties:
        entity_type:
          type: string
          description: The platform entity type, which selects the identifier prefix.
          example: client
        source: {type: string, description: The authoritative system., example: espocrm}
        source_id: {type: string, description: The identifier within that system.}
        tenant_id: {type: string, description: The owning tenant, when ownership is known.}
        metadata:
          type: object
          description: Integration metadata. Must not carry confidential upstream content.
          additionalProperties: true

    GlobalEntity:
      type: object
      required: [global_id, entity_type, source, source_id, created_at]
      properties:
        global_id: {type: string, pattern: '^[A-Z]+-[0-9]+$'}
        entity_type: {type: string}
        source: {type: string}
        source_id: {type: string}
        tenant_id: {type: string}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    AuditEvent:
      type: object
      required: [id, occurred_at, action]
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        subject: {type: string, description: The authentik subject of the actor.}
        global_user_id: {type: string, description: The actor's `USR-*` Global ID.}
        action: {type: string, description: '`entity.action` naming, e.g. `global_id.created`.'}
        resource_type: {type: string}
        resource_id: {type: string}
        request_id: {type: string, description: Correlates the event with the originating request.}
        source_ip: {type: string}
        metadata: {type: object, additionalProperties: true}

    Role:
      type: object
      required: [id, name, kind, description, enabled, permissions, modules]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [human, service]}
        description: {type: string}
        enabled: {type: boolean}
        permissions: {type: array, items: {type: string}}
        modules: {type: array, items: {type: string}}

    ScopeGrant:
      type: object
      description: |
        A permission granted to a principal within one scope. Evaluation denies
        by default: a resource with no matching grant is refused.
      required: [principal_type, principal_id, scope_type, scope_id, permission_id]
      properties:
        principal_type: {type: string, enum: [user, service, group]}
        principal_id: {type: string}
        scope_type: {type: string, enum: [global, tenant, client, project, resource]}
        scope_id: {type: string, description: '`*` grants the permission across the whole scope type.'}
        permission_id: {type: string}

    ServicePrincipal:
      type: object
      required: [id, subject, groups, roles, permissions]
      properties:
        id: {type: string, description: Immutable `SVC-*` Global ID., pattern: '^SVC-[0-9]+$'}
        subject: {type: string}
        name: {type: string}
        username: {type: string}
        groups: {type: array, items: {type: string}}
        roles: {type: array, items: {type: string}}
        permissions: {type: array, items: {type: string}}

    AdapterInfo:
      type: object
      required: [id, name, version, status, capabilities]
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: string}
        status: {type: string, enum: [ready, degraded, disabled]}
        capabilities: {type: array, items: {type: string}}

    AdapterHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, degraded, disabled]}
        message:
          type: string
          description: |
            A credential-safe explanation of a non-ready state. It never
            carries an API key, an Authorization header or an upstream payload.

    EventEnvelope:
      type: object
      description: |
        The normalized platform event envelope. Only `event` and `source` are
        required from a publisher; the platform fills the rest in during
        normalization, so every published envelope carries `occurred_at`,
        `severity`, `actor_id` and `request_id`.
      required: [event, source]
      properties:
        event:
          type: string
          description: '`entity.action` naming, e.g. `backup.failed`.'
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$'
        source: {type: string, description: The publishing system.}
        actor_id: {type: string, description: Defaults to the publishing service identity.}
        entity_id: {type: string, description: The subject Global ID, when the event has one.}
        tenant_id: {type: string}
        severity: {type: string, enum: [debug, info, warning, error, critical], default: info}
        occurred_at: {type: string, format: date-time, description: Defaults to the time of publication. Always present on a published envelope.}
        request_id: {type: string, description: Defaults to the request correlation id.}
        data: {type: object, additionalProperties: true}
